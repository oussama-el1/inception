services:
  mariadb:
    container_name: mariadb
    image: mariadb
    build:
      context: requirements/mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    expose:
      - "3306"

  wordpress:
    container_name: wordpress
    image: wordpress
    build:
      context: requirements/wordpress
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    expose:
      - "9000"

  nginx:
    container_name: nginx
    image: nginx
    build:
      context: requirements/nginx
    restart: always
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress

  redis:
      container_name: redis
      image: redis
      build:
        context: requirements/bonus/redis
      restart: always
      networks:
        - inception

  ftp:
    container_name: ftp
    image: ftp
    build:
      context: requirements/bonus/ftp
    restart: always
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    ports:
      - "21:21"
      - "21100-21105:21100-21105"

  adminer:
    container_name: adminer
    image: adminer
    build:
      context: requirements/bonus/adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - inception

  website:
    container_name: website
    image: website
    build:
      context: requirements/bonus/website
    restart: always
    ports:
      - "8000:8000"
    networks:
      - inception

  glances:
    container_name: glances
    image: glances
    build:
      context: requirements/bonus/glances
    restart: always
    ports:
      - "61208:61208"
    networks:
      - inception

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/oel-hadr/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/oel-hadr/data/wordpress

networks:
  inception:
    driver: bridge