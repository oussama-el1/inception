<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inception Bonus</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --secondary: #c084fc;
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(192, 132, 252, 0.1) 0%, transparent 20%);
        }

        .container {
            position: relative;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); }

        .glitch {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p { color: #94a3b8; margin-bottom: 2rem; line-height: 1.6; }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 1rem 0;
        }

        .stat-item h3 { color: var(--text); font-size: 1.2rem; }
        .stat-item span { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }

        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #fff;
            text-decoration: none;
            border-radius: 99px;
            font-weight: 700;
            transition: opacity 0.3s;
        }
        .btn:hover { opacity: 0.9; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="glitch">oel-hadr</h1>
            <p>System Administrator &<br>Full Stack Developer</p>
            
            <div class="stats">
                <div class="stat-item">
                    <h3>42</h3>
                    <span>Level</span>
                </div>
                <div class="stat-item">
                    <h3>100%</h3>
                    <span>Uptime</span>
                </div>
                <div class="stat-item">
                    <h3>Docker</h3>
                    <span>Master</span>
                </div>
            </div>

            <a href="#" class="btn">Contact Me</a>
        </div>
    </div>
</body>
</html>
